<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../public/assets/site.css">
<style>
  :root { color-scheme: light; --paper:#f4f6fb; --ink:#121a2e; --ink-2:#4b556b; --accent:#1753e8; }
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; background:var(--paper); color:var(--ink); }
  *, *::before, *::after { animation: none !important; }
  .box path, .sig path { stroke-dashoffset: 0 !important; }
  .og { display:grid; grid-template-columns: 1fr 400px; gap:40px; align-items:center; height:630px; padding: 0 80px 0 84px; box-sizing:border-box; }
  .og .brand img { width:64px; height:64px; }
  .og .brand span { font-size:2.6rem; }
  .og h1 { font-size:4.4rem; margin:36px 0 26px; }
  .og h1 em { font-style:normal; color:var(--accent); }
  .og .promises { font-size:1.45rem; gap:10px 30px; margin:0; }
  .og .promises li::before { width:22px; height:22px; }
  .og .demo { width:330px; margin-top:150px; }
</style></head>
<body><div class="og">
  <div>
    <div class="brand"><img src="../public/assets/icon-192.png" alt=""><span>Penlet</span></div>
    <h1>Fill in and sign PDFs <em>on your phone.</em></h1>
    <ul class="promises"><li>No account</li><li>No ads</li><li>Everything stays on your phone</li></ul>
  </div>
  <div class="demo" aria-hidden="true">
      <div class="phone">
        <div class="screen">
          <div class="appbar"><i></i> consent.pdf</div>
          <div class="sheet">
            <p class="title">CONSENT FORM</p>
            <div class="field f1"><span>Name</span><b><span>Kari Nordmann</span></b></div>
            <div class="field f2"><span>Address</span><b><span>12 Market Street</span></b></div>
            <div class="field f3"><span>Date</span><b><span>28 Oct 2026</span></b></div>
            <div class="consent">
              <span class="box"><svg viewBox="0 0 22 22"><path d="M5 5l12 12" pathLength="1" stroke-width="2.4" stroke-linecap="round"/><path d="M17 5L5 17" pathLength="1" stroke-width="2.4" stroke-linecap="round"/></svg></span>
              I have read and accept the terms
            </div>
            <div class="sigline" data-label="Signature">
              <svg class="sig" viewBox="0 0 170 56" preserveAspectRatio="xMinYMax meet"><path pathLength="1" d="M8 42c6-20 14-34 18-30s-8 30-12 36c6-10 12-16 16-14s0 10 4 8 6-10 10-10 2 8 6 8 6-12 10-12-2 12 2 12 8-14 12-14-4 16 0 18c6-6 10-20 16-30 2 10-6 24-4 30 4-8 10-14 16-14s2 8 8 6 18-6 30-10"/></svg>
            </div>
          </div>
          <div class="toolbar">
            <div><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Text</div>
            <div><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8l8 8M16 8l-8 8"/></svg>Cross</div>
            <div><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Date</div>
            <div class="on"><svg viewBox="0 0 24 24"><path d="M3 17c3-5 5-7 6-5s-2 6 1 5 4-6 6-6 0 5 2 5 2-2 3-3M14 4l4 4-7 7H7v-4l7-7Z"/></svg>Sign</div>
          </div>
        </div>
      </div>
    </div>
  
</div></body></html>
